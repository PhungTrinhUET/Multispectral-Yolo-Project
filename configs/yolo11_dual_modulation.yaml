# Ultralytics YOLO 🚀, AGPL-3.0 license
# EXP 13: GMD-YOLO (R-G-NIR + NDVI Modulation)
# - Stream 1 (Main): R, G, NIR (3 channels) -> YOLOv11s
# - Stream 2 (Aux):  NDVI (1 channel) -> YOLOv11n
# - Fusion: Feature-wise Linear Modulation (FiLM) tại Neck.

# Parameters
nc: 4
scales:
  custom: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, InputContainer, []] # 0

  # =========================================================
  # 1. MAIN STREAM: R, G, NIR (3 Channels) - Base: YOLOv11s
  # =========================================================
  - [0, 1, Conv, [32, 3, 2]] # 1 (Stem - Input 3 kênh)
  - [-1, 1, Conv, [64, 3, 2]] # 2
  - [-1, 1, C3k2, [128, False, 0.25]] # 3
  - [-1, 1, Conv, [128, 3, 2]] # 4
  - [-1, 1, C3k2, [128, False, 0.5]] # 5 (P3 Main)
  - [-1, 1, Conv, [128, 3, 2]] # 6
  - [-1, 1, C3k2, [256, True, 0.5]] # 7 (P4 Main)
  - [-1, 1, Conv, [256, 3, 2]] # 8
  - [-1, 1, C3k2, [512, True, 0.5]] # 9
  - [-1, 1, SPPF, [512, 5]] # 10 (P5 Main Output)

  # =========================================================
  # 2. AUX STREAM: NDVI (1 Channel) - Base: YOLOv11n
  # =========================================================
  - [0, 1, Conv, [16, 3, 2]] # 11 (Stem - Input 1 kênh NDVI)
  - [-1, 1, Conv, [32, 3, 2]] # 12
  - [-1, 1, C3k2, [64, False, 0.25]] # 13
  - [-1, 1, Conv, [64, 3, 2]] # 14
  - [-1, 1, C3k2, [128, False, 0.5]] # 15 (P3 Aux - Up lên 128 để khớp Main)
  - [-1, 1, Conv, [128, 3, 2]] # 16
  - [-1, 1, C3k2, [256, True, 0.5]] # 17 (P4 Aux - Up lên 256 để khớp Main)
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [-1, 1, C3k2, [512, True, 0.5]] # 19 (P5 Aux - Up lên 512 để khớp Main)
  - [-1, 1, SPPF, [512, 5]] # 20 (P5 Aux Output)

head:
  # =========================================================
  # GMD FUSION NECK (Modulation)
  # Input: [Main, Aux] -> Aux điều khiển Main -> Output Main'
  # =========================================================

  # 1. Fusion P5
  # Input: [Layer 10 (R-G-NIR), Layer 20 (NDVI)]
  - [[10, 20], 1, FusionModulation, []] # 21 -> Fused P5

  # 2. Fusion P4
  # Input: [Layer 7 (R-G-NIR), Layer 17 (NDVI)]
  - [[7, 17], 1, FusionModulation, []] # 22 -> Fused P4

  # 3. Fusion P3
  # Input: [Layer 5 (R-G-NIR), Layer 15 (NDVI)]
  - [[5, 15], 1, FusionModulation, []] # 23 -> Fused P3

  # =========================================================
  # STANDARD DETECTION HEAD
  # =========================================================
  # Upsample P5 -> P4
  - [21, 1, nn.Upsample, [None, 2, "nearest"]] # 24
  - [[-1, 22], 1, Concat, [1]] # 25 (Concat với Fused P4)
  - [-1, 1, C3k2, [512, False]] # 26

  # Upsample P4 -> P3
  - [26, 1, nn.Upsample, [None, 2, "nearest"]] # 27
  - [[-1, 23], 1, Concat, [1]] # 28 (Concat với Fused P3)
  - [-1, 1, C3k2, [256, False]] # 29

  # Downsample P3 -> P4
  - [29, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 26], 1, Concat, [1]] # 31
  - [-1, 1, C3k2, [512, False]] # 32

  # Downsample P4 -> P5
  - [32, 1, Conv, [512, 3, 2]] # 33
  - [[-1, 21], 1, Concat, [1]] # 34
  - [-1, 1, C3k2, [512, True]] # 35

  # Detect
  - [[29, 32, 35], 1, Detect, [nc]] # 36
