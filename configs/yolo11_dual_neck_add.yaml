# Ultralytics YOLO 🚀, AGPL-3.0 license
# Ablation: Neck ADD (Element-wise Sum) vs CMX Rectify
#
# Architecture:
#   - Backbone: Identical to CMX (yolo11_dual_cmx.yaml)
#     Stream 1 (Main): R, G, NIR (3ch) -> YOLOv11s  P3=128, P4=256, P5=512
#     Stream 2 (Aux):  NDVI (1ch)      -> YOLOv11n  P3=128, P4=256, P5=512
#   - Fusion Neck: FusionAdd (x[0] + x[1]) at P3, P4, P5
#   - Pretrain: yolo_dual_modulation_pretrain.pt (backbone identical to CMX/Exp13)
#     Only neck layers 21-23 (FusionAdd) are trivially initialized — no learnable params.

nc: 4
scales:
  custom: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, InputContainer, []] # 0: Split 4ch -> [RGB(3ch), NDVI(1ch)]

  # =========================================================
  # STREAM 1: R-G-NIR (Main) - YOLOv11s scale
  # Output channels: P3=128, P4=256, P5=512
  # =========================================================
  - [0, 1, Conv, [32, 3, 2]]          # 1
  - [-1, 1, Conv, [64, 3, 2]]         # 2
  - [-1, 1, C3k2, [128, False, 0.25]] # 3
  - [-1, 1, Conv, [128, 3, 2]]        # 4
  - [-1, 1, C3k2, [128, False, 0.5]]  # 5  <- P3 RGB = 128ch
  - [-1, 1, Conv, [128, 3, 2]]        # 6
  - [-1, 1, C3k2, [256, True, 0.5]]   # 7  <- P4 RGB = 256ch
  - [-1, 1, Conv, [256, 3, 2]]        # 8
  - [-1, 1, C3k2, [512, True, 0.5]]   # 9
  - [-1, 1, SPPF, [512, 5]]           # 10 <- P5 RGB = 512ch

  # =========================================================
  # STREAM 2: NDVI (Aux) - YOLOv11n scale (channel-matched to Stream 1)
  # Output channels: P3=128, P4=256, P5=512
  # =========================================================
  - [0, 1, Conv, [16, 3, 2]]          # 11
  - [-1, 1, Conv, [32, 3, 2]]         # 12
  - [-1, 1, C3k2, [64, False, 0.25]]  # 13
  - [-1, 1, Conv, [64, 3, 2]]         # 14
  - [-1, 1, C3k2, [128, False, 0.5]]  # 15 <- P3 NDVI = 128ch
  - [-1, 1, Conv, [128, 3, 2]]        # 16
  - [-1, 1, C3k2, [256, True, 0.5]]   # 17 <- P4 NDVI = 256ch
  - [-1, 1, Conv, [256, 3, 2]]        # 18
  - [-1, 1, C3k2, [512, True, 0.5]]   # 19
  - [-1, 1, SPPF, [512, 5]]           # 20 <- P5 NDVI = 512ch

head:
  # =========================================================
  # ADD FUSION NECK
  # Element-wise sum: RGB + NDVI (same channel count, no learnable params)
  # =========================================================
  - [[10, 20], 1, FusionAdd, []] # 21 <- Fused P5 = 512ch
  - [[7, 17], 1, FusionAdd, []]  # 22 <- Fused P4 = 256ch
  - [[5, 15], 1, FusionAdd, []]  # 23 <- Fused P3 = 128ch

  # =========================================================
  # DETECTION HEAD (PANet — identical to CMX)
  # =========================================================

  # Top-down: P5 -> P4
  - [21, 1, nn.Upsample, [None, 2, "nearest"]] # 24: 512ch
  - [[-1, 22], 1, Concat, [1]]                 # 25: 512+256=768ch
  - [-1, 1, C3k2, [512, False]]                # 26: 512ch

  # Top-down: P4 -> P3
  - [26, 1, nn.Upsample, [None, 2, "nearest"]] # 27: 512ch
  - [[-1, 23], 1, Concat, [1]]                 # 28: 512+128=640ch
  - [-1, 1, C3k2, [256, False]]                # 29: 256ch <- P3 detect output

  # Bottom-up: P3 -> P4
  - [29, 1, Conv, [256, 3, 2]]    # 30: 256ch
  - [[-1, 26], 1, Concat, [1]]    # 31: 256+512=768ch
  - [-1, 1, C3k2, [512, False]]   # 32: 512ch <- P4 detect output

  # Bottom-up: P4 -> P5
  - [32, 1, Conv, [512, 3, 2]]    # 33: 512ch
  - [[-1, 21], 1, Concat, [1]]    # 34: 512+512=1024ch
  - [-1, 1, C3k2, [512, True]]    # 35: 512ch <- P5 detect output

  # Detect from [P3=256ch, P4=512ch, P5=512ch]
  - [[29, 32, 35], 1, Detect, [nc]] # 36
